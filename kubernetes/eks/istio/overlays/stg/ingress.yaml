apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: istio-ingress
  namespace: istio-system
  annotations:
    alb.ingress.kubernetes.io/group.name: cp
    alb.ingress.kubernetes.io/scheme: internet-facing
    alb.ingress.kubernetes.io/target-type: ip
    alb.ingress.kubernetes.io/healthcheck-path: /healthz/ready
    alb.ingress.kubernetes.io/healthcheck-port: "15021"
    alb.ingress.kubernetes.io/success-codes: '200'
    alb.ingress.kubernetes.io/listen-ports: '[{"HTTPS":443}]'
    alb.ingress.kubernetes.io/certificate-arn: arn:aws:acm:ap-northeast-1:374146079343:certificate/660c426f-0c58-4745-8e4d-79c491c45b73
spec:
  ingressClassName: alb
  rules:
    # MEMO: 本来なら"*"としたいが、コストを考慮して他のカリキュラムとALBを共有しているため、具体的なドメインを指定している
    - host: "sm-api-v3.stg.ngsw-app.click"
      http:
        paths:
          - path:
            pathType: ImplementationSpecific
            backend:
              service:
                name: istio-ingressgateway
                port:
                  number: 80
